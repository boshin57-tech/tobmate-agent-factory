[build-system]
requires=["hatchling>=1.25"]
build-backend="hatchling.build"

[project]
name="af-core"
version="1.0.0"
requires-python=">=3.11"

dependencies=[
"pydantic>=2",
"sqlalchemy>=2",
"httpx>=0.27.1,<1",
"mcp>=1.29,<2",
"psycopg[binary]>=3.2,<4"
]

[project.optional-dependencies]
dev=[
"pytest>=8"
]
